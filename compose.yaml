# Project: COMPASS
# File: compose.yaml
# Purpose: Podman Compose service definitions — web (Django) + db (PostgreSQL 16)
# Containerized development operations.
# Notes: Use compose.override.yaml for local dev overrides (ports, volumes).
#   "podman compose up -d" to start. "podman compose down" to stop.

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compass}
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - compass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compass}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - compass_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Containerfile
      # Keep the build architecture selected by the host/runtime. Pulling the
      # base image prevents a cached image for another architecture from being
      # reused by Podman Compose.
      pull: true
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      COMPASS_ENVIRONMENT: ${COMPASS_ENVIRONMENT:-development}
      COMPASS_ACCESS_MODE: ${COMPASS_ACCESS_MODE:-active}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?AUDIT_HASH_SECRET must be set in .env}
      ACCOUNT_SECURITY_HASH_SECRET: ${ACCOUNT_SECURITY_HASH_SECRET:?ACCOUNT_SECURITY_HASH_SECRET must be set in .env}
      ACCOUNT_ACTIVATION_TOKEN_SECRET: ${ACCOUNT_ACTIVATION_TOKEN_SECRET:?ACCOUNT_ACTIVATION_TOKEN_SECRET must be set in .env}
      DEBUG: ${DEBUG:-True}
      MAINTENANCE_ENFORCEMENT_ENABLED: ${MAINTENANCE_ENFORCEMENT_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_ENABLED: ${DOCUMENT_PDF_RENDERER_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_TIMEOUT_MS: ${DOCUMENT_PDF_RENDERER_TIMEOUT_MS:-30000}
      ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS: ${ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS:-5}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      # The base file has no notification-worker service. The local
      # development override enables this declaration alongside that service.
      NOTIFICATION_WORKER_ENABLED: "False"
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-5}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-20}
      NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS: ${NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS:-300}
      BACKUP_WORKER_POLL_INTERVAL_SECONDS: ${BACKUP_WORKER_POLL_INTERVAL_SECONDS:-15}
      REPORT_SYNC_MAX_OUTPUT_BYTES: ${REPORT_SYNC_MAX_OUTPUT_BYTES:-262144}
      REPORT_SYNC_MAX_WORK_UNITS: ${REPORT_SYNC_MAX_WORK_UNITS:-1000}
      REPORT_ASYNC_AFTER_WORK_UNITS: ${REPORT_ASYNC_AFTER_WORK_UNITS:-3000}
      REPORT_RUN_TIMEOUT_SECONDS: ${REPORT_RUN_TIMEOUT_SECONDS:-60}
      REPORT_EXPORT_MAX_OUTPUT_BYTES: ${REPORT_EXPORT_MAX_OUTPUT_BYTES:-8388608}
      PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES: ${PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-False}
      KEY_SOURCE_PROVIDER: ${KEY_SOURCE_PROVIDER:-env}
      KEY_SOURCE_PODMAN_SECRETS_DIR: ${KEY_SOURCE_PODMAN_SECRETS_DIR:-/app/secrets}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      COMPASS_DEMO_IT_ADMIN_EMAIL: ${COMPASS_DEMO_IT_ADMIN_EMAIL:-}
      COMPASS_DEMO_HEAD_GUIDANCE_EMAIL: ${COMPASS_DEMO_HEAD_GUIDANCE_EMAIL:-}
      COMPASS_DEMO_COUNSELOR_EMAIL: ${COMPASS_DEMO_COUNSELOR_EMAIL:-}
      COMPASS_DEMO_GCO_STAFF_EMAIL: ${COMPASS_DEMO_GCO_STAFF_EMAIL:-}
      COMPASS_DEMO_STUDENT_EMAIL: ${COMPASS_DEMO_STUDENT_EMAIL:-}
      ECOUNSELING_PROVIDER: ${ECOUNSELING_PROVIDER:-DAILY}
      ECOUNSELING_PROVIDER_MODE: ${ECOUNSELING_PROVIDER_MODE:-DAILY_CLOUD}
      ECOUNSELING_DAILY_API_KEY: ${ECOUNSELING_DAILY_API_KEY:-}
      ECOUNSELING_DAILY_DOMAIN: ${ECOUNSELING_DAILY_DOMAIN:-}
      ECOUNSELING_DAILY_WEBHOOK_SECRET: ${ECOUNSELING_DAILY_WEBHOOK_SECRET:-}
      ECOUNSELING_DAILY_WEBHOOK_ID: ${ECOUNSELING_DAILY_WEBHOOK_ID:-}
      ECOUNSELING_DAILY_WEBHOOK_URL: ${ECOUNSELING_DAILY_WEBHOOK_URL:-}
      PROTECTED_STORAGE_LOCAL_ROOT: /protected-media
      PROTECTED_STORAGE_BACKEND: ${PROTECTED_STORAGE_BACKEND:-s3}
      PROTECTED_STORAGE_S3_ENDPOINT_URL: ${PROTECTED_STORAGE_S3_ENDPOINT_URL:-http://minio:9000}
      PROTECTED_STORAGE_S3_ACCESS_KEY: ${PROTECTED_STORAGE_S3_ACCESS_KEY:?PROTECTED_STORAGE_S3_ACCESS_KEY must be set in .env}
      PROTECTED_STORAGE_S3_SECRET_KEY: ${PROTECTED_STORAGE_S3_SECRET_KEY:?PROTECTED_STORAGE_S3_SECRET_KEY must be set in .env}
      PROTECTED_STORAGE_S3_BUCKET_NAME: ${PROTECTED_STORAGE_S3_BUCKET_NAME:-compass-private}
      BACKUP_STORAGE_BACKEND: ${BACKUP_STORAGE_BACKEND:-s3_compatible}
      BACKUP_STORAGE_S3_ENDPOINT_URL: ${BACKUP_STORAGE_S3_ENDPOINT_URL:-http://minio:9000}
      BACKUP_STORAGE_S3_USE_SSL: ${BACKUP_STORAGE_S3_USE_SSL:-False}
      BACKUP_STORAGE_S3_ACCESS_KEY: ${BACKUP_STORAGE_S3_ACCESS_KEY:?BACKUP_STORAGE_S3_ACCESS_KEY must be set in .env}
      BACKUP_STORAGE_S3_SECRET_KEY: ${BACKUP_STORAGE_S3_SECRET_KEY:?BACKUP_STORAGE_S3_SECRET_KEY must be set in .env}
      BACKUP_STORAGE_S3_BUCKET: ${BACKUP_STORAGE_S3_BUCKET:-compass-backups}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ecounseling-recording-worker:
    profiles: ["ecounseling-recording"]
    build:
      context: .
      dockerfile: Containerfile
      pull: true
    command:
      - python
      - manage.py
      - monitor_ecounseling_recordings
      - --loop
      - --interval
      - "5"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      COMPASS_ENVIRONMENT: ${COMPASS_ENVIRONMENT:-development}
      COMPASS_ACCESS_MODE: ${COMPASS_ACCESS_MODE:-active}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?AUDIT_HASH_SECRET must be set in .env}
      ACCOUNT_SECURITY_HASH_SECRET: ${ACCOUNT_SECURITY_HASH_SECRET:?ACCOUNT_SECURITY_HASH_SECRET must be set in .env}
      ACCOUNT_ACTIVATION_TOKEN_SECRET: ${ACCOUNT_ACTIVATION_TOKEN_SECRET:?ACCOUNT_ACTIVATION_TOKEN_SECRET must be set in .env}
      DEBUG: ${DEBUG:-True}
      MAINTENANCE_ENFORCEMENT_ENABLED: ${MAINTENANCE_ENFORCEMENT_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_ENABLED: ${DOCUMENT_PDF_RENDERER_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_TIMEOUT_MS: ${DOCUMENT_PDF_RENDERER_TIMEOUT_MS:-30000}
      ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS: ${ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS:-5}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-False}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-5}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-20}
      NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS: ${NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS:-300}
      BACKUP_WORKER_POLL_INTERVAL_SECONDS: ${BACKUP_WORKER_POLL_INTERVAL_SECONDS:-15}
      REPORT_SYNC_MAX_OUTPUT_BYTES: ${REPORT_SYNC_MAX_OUTPUT_BYTES:-262144}
      REPORT_SYNC_MAX_WORK_UNITS: ${REPORT_SYNC_MAX_WORK_UNITS:-1000}
      REPORT_ASYNC_AFTER_WORK_UNITS: ${REPORT_ASYNC_AFTER_WORK_UNITS:-3000}
      REPORT_RUN_TIMEOUT_SECONDS: ${REPORT_RUN_TIMEOUT_SECONDS:-60}
      REPORT_EXPORT_MAX_OUTPUT_BYTES: ${REPORT_EXPORT_MAX_OUTPUT_BYTES:-8388608}
      PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES: ${PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-False}
      KEY_SOURCE_PROVIDER: ${KEY_SOURCE_PROVIDER:-env}
      KEY_SOURCE_PODMAN_SECRETS_DIR: ${KEY_SOURCE_PODMAN_SECRETS_DIR:-/app/secrets}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set in .env}
      COMPASS_DEMO_IT_ADMIN_EMAIL: ${COMPASS_DEMO_IT_ADMIN_EMAIL:-}
      COMPASS_DEMO_HEAD_GUIDANCE_EMAIL: ${COMPASS_DEMO_HEAD_GUIDANCE_EMAIL:-}
      COMPASS_DEMO_COUNSELOR_EMAIL: ${COMPASS_DEMO_COUNSELOR_EMAIL:-}
      COMPASS_DEMO_GCO_STAFF_EMAIL: ${COMPASS_DEMO_GCO_STAFF_EMAIL:-}
      COMPASS_DEMO_STUDENT_EMAIL: ${COMPASS_DEMO_STUDENT_EMAIL:-}
      ECOUNSELING_PROVIDER: ${ECOUNSELING_PROVIDER:-DAILY}
      ECOUNSELING_PROVIDER_MODE: ${ECOUNSELING_PROVIDER_MODE:-DAILY_CLOUD}
      ECOUNSELING_DAILY_API_KEY: ${ECOUNSELING_DAILY_API_KEY:-}
      ECOUNSELING_DAILY_DOMAIN: ${ECOUNSELING_DAILY_DOMAIN:-}
      ECOUNSELING_DAILY_WEBHOOK_SECRET: ${ECOUNSELING_DAILY_WEBHOOK_SECRET:-}
      ECOUNSELING_DAILY_WEBHOOK_ID: ${ECOUNSELING_DAILY_WEBHOOK_ID:-}
      ECOUNSELING_DAILY_WEBHOOK_URL: ${ECOUNSELING_DAILY_WEBHOOK_URL:-}
      PROTECTED_STORAGE_LOCAL_ROOT: /protected-media
      PROTECTED_STORAGE_BACKEND: ${PROTECTED_STORAGE_BACKEND:-s3}
      PROTECTED_STORAGE_S3_ENDPOINT_URL: ${PROTECTED_STORAGE_S3_ENDPOINT_URL:-http://minio:9000}
      PROTECTED_STORAGE_S3_ACCESS_KEY: ${PROTECTED_STORAGE_S3_ACCESS_KEY:?PROTECTED_STORAGE_S3_ACCESS_KEY must be set in .env}
      PROTECTED_STORAGE_S3_SECRET_KEY: ${PROTECTED_STORAGE_S3_SECRET_KEY:?PROTECTED_STORAGE_S3_SECRET_KEY must be set in .env}
      PROTECTED_STORAGE_S3_BUCKET_NAME: ${PROTECTED_STORAGE_S3_BUCKET_NAME:-compass-private}
      BACKUP_STORAGE_BACKEND: ${BACKUP_STORAGE_BACKEND:-s3_compatible}
      BACKUP_STORAGE_S3_ENDPOINT_URL: ${BACKUP_STORAGE_S3_ENDPOINT_URL:-http://minio:9000}
      BACKUP_STORAGE_S3_USE_SSL: ${BACKUP_STORAGE_S3_USE_SSL:-False}
      BACKUP_STORAGE_S3_ACCESS_KEY: ${BACKUP_STORAGE_S3_ACCESS_KEY:?BACKUP_STORAGE_S3_ACCESS_KEY must be set in .env}
      BACKUP_STORAGE_S3_SECRET_KEY: ${BACKUP_STORAGE_S3_SECRET_KEY:?BACKUP_STORAGE_S3_SECRET_KEY must be set in .env}
      BACKUP_STORAGE_S3_BUCKET: ${BACKUP_STORAGE_S3_BUCKET:-compass-backups}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PROTECTED_STORAGE_S3_ACCESS_KEY:?PROTECTED_STORAGE_S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${PROTECTED_STORAGE_S3_SECRET_KEY:?PROTECTED_STORAGE_S3_SECRET_KEY must be set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - compass_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${PROTECTED_STORAGE_S3_ACCESS_KEY:?PROTECTED_STORAGE_S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${PROTECTED_STORAGE_S3_SECRET_KEY:?PROTECTED_STORAGE_S3_SECRET_KEY must be set in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sleep 5
        /usr/bin/mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        /usr/bin/mc mb myminio/compass-private --ignore-existing
        /usr/bin/mc mb myminio/compass-backups --ignore-existing

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  compass_pgdata:
  compass_redis_data:
  compass_minio_data:
