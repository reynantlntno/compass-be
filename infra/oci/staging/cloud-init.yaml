#cloud-config
# Oracle Linux bootstrap. It installs only host/container prerequisites;
# application code, images, and secret values arrive through the approved
# Bastion deployment path after Terraform completes.
bootcmd:
  - |
    printf '%s\n' 'nameserver 169.254.169.254' > /etc/resolv.conf

write_files:
  - path: /usr/local/sbin/compass-host-bootstrap
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      printf '%s\n' 'nameserver 169.254.169.254' > /etc/resolv.conf

      data_device=/dev/oracleoci/oraclevdb
      data_root=/srv/compass/data

      if [ ! -b "$data_device" ]; then
        echo "Expected attached data device is unavailable." >&2
        exit 1
      fi

      # Never reformat a device that already has a filesystem.
      if ! blkid "$data_device" >/dev/null 2>&1; then
        mkfs.ext4 -F "$data_device"
      fi

      install -d -m 0755 /srv/compass
      install -d -m 0700 "$data_root"
      data_uuid=$(blkid -s UUID -o value "$data_device")
      if ! grep -q "UUID=$data_uuid $data_root " /etc/fstab; then
        printf 'UUID=%s %s ext4 defaults,nofail 0 2\n' "$data_uuid" "$data_root" >> /etc/fstab
      fi
      if ! mountpoint -q "$data_root"; then
        mount "$data_root"
      fi

      install -d -m 0770 "$data_root/postgres" "$data_root/redis" "$data_root/backup-work"
      install -d -m 0750 /srv/compass/releases /etc/compass
      chown -R root:root /srv/compass /etc/compass

      # podman compose delegates to podman-compose on Oracle Linux. Pinning the
      # provider avoids depending on a Docker daemon or registry service.
      python3 -m pip install --no-cache-dir podman-compose==1.2.0
      python3 -m pip install --no-cache-dir oci-cli==3.90.2

      systemctl enable --now firewalld
      firewall-cmd --permanent --zone=public --remove-service=ssh || true
      firewall-cmd --permanent --zone=public --add-rich-rule='rule family=ipv4 source address=10.0.10.0/24 port port=8080 protocol=tcp accept'
      firewall-cmd --permanent --zone=public --add-rich-rule='rule family=ipv4 source address=10.0.30.0/24 port port=22 protocol=tcp accept'
      firewall-cmd --reload

      echo "COMPASS host bootstrap complete."

runcmd:
  - [bash, /usr/local/sbin/compass-host-bootstrap]
