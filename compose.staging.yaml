# COMPASS OCI staging deployment.
#
# This is intentionally self-contained. It does not inherit local-development
# defaults, build instructions, MinIO, Mailpit, or recording services. Load the
# verified image before starting the stack:
#
#   podman compose --env-file /etc/compass/staging.env \
#     -f compose.staging.yaml up -d

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compass}
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD_FILE: /run/secrets/compass-staging-postgres-password
    volumes:
      - ${COMPASS_DATA_ROOT:-/srv/compass/data}/postgres:/var/lib/postgresql/data:Z
    secrets:
      - compass-staging-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compass} -d ${POSTGRES_DB:-compass}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${COMPASS_DATA_ROOT:-/srv/compass/data}/redis:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: ${COMPASS_IMAGE_REF:?COMPASS_IMAGE_REF is required; provide an image built for the target host architecture}
    entrypoint: ["/usr/local/bin/compass-secret-env"]
    command:
      - /bin/sh
      - -ec
      - >-
        python manage.py migrate --noinput &&
        python manage.py sync_notification_templates &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers ${GUNICORN_WORKERS:-2}
        --timeout ${GUNICORN_TIMEOUT_SECONDS:-60}
        --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT_SECONDS:-30}
        --max-requests ${GUNICORN_MAX_REQUESTS:-1000}
        --max-requests-jitter ${GUNICORN_MAX_REQUESTS_JITTER:-100}
        --access-logfile -
        --access-logformat '%({X-Forwarded-For}i)s %(U)s %(m)s %(s)s'
        --error-logfile -
        --capture-output
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      COMPASS_ACCESS_MODE: ${COMPASS_ACCESS_MODE:-health_only}
      COMPASS_SECRET_PREFIX: ${COMPASS_SECRET_PREFIX:-compass-staging}
      DEBUG: "False"
      MAINTENANCE_ENFORCEMENT_ENABLED: ${MAINTENANCE_ENFORCEMENT_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_ENABLED: ${DOCUMENT_PDF_RENDERER_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_TIMEOUT_MS: ${DOCUMENT_PDF_RENDERER_TIMEOUT_MS:-30000}
      ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS: ${ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS:-5}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-True}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-5}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-20}
      NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS: ${NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS:-300}
      BACKUP_WORKER_POLL_INTERVAL_SECONDS: ${BACKUP_WORKER_POLL_INTERVAL_SECONDS:-15}
      REPORT_SYNC_MAX_OUTPUT_BYTES: ${REPORT_SYNC_MAX_OUTPUT_BYTES:-262144}
      REPORT_SYNC_MAX_WORK_UNITS: ${REPORT_SYNC_MAX_WORK_UNITS:-1000}
      REPORT_ASYNC_AFTER_WORK_UNITS: ${REPORT_ASYNC_AFTER_WORK_UNITS:-3000}
      REPORT_RUN_TIMEOUT_SECONDS: ${REPORT_RUN_TIMEOUT_SECONDS:-60}
      REPORT_EXPORT_MAX_OUTPUT_BYTES: ${REPORT_EXPORT_MAX_OUTPUT_BYTES:-8388608}
      PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES: ${PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-staging-api.compass-gco.com},web,proxy,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://staging.compass-gco.com,https://staging-api.compass-gco.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.compass-gco.com}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-False}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/0}
      ECOUNSELING_PROVIDER: ${ECOUNSELING_PROVIDER:-DAILY}
      ECOUNSELING_PROVIDER_MODE: ${ECOUNSELING_PROVIDER_MODE:-DAILY_CLOUD}
      ECOUNSELING_DAILY_API_KEY: ${ECOUNSELING_DAILY_API_KEY:-}
      ECOUNSELING_DAILY_DOMAIN: ${ECOUNSELING_DAILY_DOMAIN:-}
      ECOUNSELING_DAILY_WEBHOOK_ID: ${ECOUNSELING_DAILY_WEBHOOK_ID:-}
      ECOUNSELING_DAILY_WEBHOOK_URL: ${ECOUNSELING_DAILY_WEBHOOK_URL:-https://staging-api.compass-gco.com/counseling/internal/e-counseling/recording-callback/}
      ECOUNSELING_ROOM_PREFIX: ${ECOUNSELING_ROOM_PREFIX:-compass-ecs}
      ECOUNSELING_ROOM_SALT: ${ECOUNSELING_ROOM_SALT:-}
      ECOUNSELING_REQUIRE_PROVIDER_AUTH_IN_PRODUCTION: ${ECOUNSELING_REQUIRE_PROVIDER_AUTH_IN_PRODUCTION:-True}
      ECOUNSELING_UNSAFE_PROVIDER_MODE_ACKNOWLEDGED: ${ECOUNSELING_UNSAFE_PROVIDER_MODE_ACKNOWLEDGED:-False}
      COMPASS_SECRET_ENV_DIR: /run/secrets
      COMPASS_SECRET_ENV_INCLUDE_TURNSTILE_SECRET: "True"
      COMPASS_SECRET_ENV_INCLUDE_EMAIL_SECRET: "True"
      COMPASS_SECRET_ENV_INCLUDE_ECOUNSELING_SECRET: "True"
      ACCOUNT_SECURITY_CAPTCHA_ADAPTER: ${ACCOUNT_SECURITY_CAPTCHA_ADAPTER:-apps.account_security.captcha.CloudflareTurnstileAdapter}
      ACCOUNT_SECURITY_CAPTCHA_PROVIDER: ${ACCOUNT_SECURITY_CAPTCHA_PROVIDER:-turnstile}
      ACCOUNT_SECURITY_TURNSTILE_SITE_KEY: ${ACCOUNT_SECURITY_TURNSTILE_SITE_KEY:?ACCOUNT_SECURITY_TURNSTILE_SITE_KEY is required for OCI staging}
      ACCOUNT_SECURITY_TURNSTILE_SECRET: ${ACCOUNT_SECURITY_TURNSTILE_SECRET:-}
      ACCOUNT_SECURITY_TURNSTILE_HOSTNAMES: ${ACCOUNT_SECURITY_TURNSTILE_HOSTNAMES:-staging.compass-gco.com}
      CSP_ENABLED: ${CSP_ENABLED:-False}
      CSP_SCRIPT_SRC: ${CSP_SCRIPT_SRC:-https://challenges.cloudflare.com}
      CSP_FRAME_SRC: ${CSP_FRAME_SRC:-https://challenges.cloudflare.com}
      COMPASS_RELEASE_VERSION: ${COMPASS_RELEASE_VERSION:?COMPASS_RELEASE_VERSION is required}
      COMPASS_BUILD_ID: ${COMPASS_BUILD_ID:?COMPASS_BUILD_ID is required}
      COMPASS_API_BASE_URL: ${COMPASS_API_BASE_URL:-https://staging-api.compass-gco.com}
      COMPASS_CLIENT_BASE_URL: ${COMPASS_CLIENT_BASE_URL:-https://staging.compass-gco.com}
      # Non-secret defense persona inbox overrides are supplied only by the
      # root-owned staging.env; they are never part of the image or repository.
      COMPASS_DEMO_IT_ADMIN_EMAIL: ${COMPASS_DEMO_IT_ADMIN_EMAIL:-}
      COMPASS_DEMO_HEAD_GUIDANCE_EMAIL: ${COMPASS_DEMO_HEAD_GUIDANCE_EMAIL:-}
      COMPASS_DEMO_COUNSELOR_EMAIL: ${COMPASS_DEMO_COUNSELOR_EMAIL:-}
      COMPASS_DEMO_GCO_STAFF_EMAIL: ${COMPASS_DEMO_GCO_STAFF_EMAIL:-}
      COMPASS_DEMO_STUDENT_EMAIL: ${COMPASS_DEMO_STUDENT_EMAIL:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.email.ap-singapore-1.oci.oraclecloud.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@mail.compass-gco.com}
      COMPASS_EMAIL_REPLY_TO: ${COMPASS_EMAIL_REPLY_TO:-noreply@mail.compass-gco.com}
      COMPASS_EMAIL_VERIFIED_SENDER_DOMAIN: ${COMPASS_EMAIL_VERIFIED_SENDER_DOMAIN:-mail.compass-gco.com}
      KEY_SOURCE_PROVIDER: ${KEY_SOURCE_PROVIDER:?KEY_SOURCE_PROVIDER is required}
      KEY_SOURCE_PODMAN_SECRETS_DIR: /run/secrets
      PROTECTED_STORAGE_BACKEND: ${PROTECTED_STORAGE_BACKEND:?PROTECTED_STORAGE_BACKEND is required}
      PROTECTED_STORAGE_S3_ENDPOINT_URL: ${PROTECTED_STORAGE_S3_ENDPOINT_URL:?PROTECTED_STORAGE_S3_ENDPOINT_URL is required}
      PROTECTED_STORAGE_S3_BUCKET_NAME: ${PROTECTED_STORAGE_S3_BUCKET_NAME:-compass-private-staging}
      PROTECTED_STORAGE_S3_USE_SSL: "True"
      PROTECTED_STORAGE_S3_REGION_NAME: ${PROTECTED_STORAGE_S3_REGION_NAME:-ap-singapore-1}
      PROTECTED_STORAGE_S3_ADDRESSING_STYLE: path
      BACKUP_STORAGE_BACKEND: ${BACKUP_STORAGE_BACKEND:?BACKUP_STORAGE_BACKEND is required}
      BACKUP_STORAGE_S3_ENDPOINT_URL: ${BACKUP_STORAGE_S3_ENDPOINT_URL:?BACKUP_STORAGE_S3_ENDPOINT_URL is required}
      BACKUP_STORAGE_S3_BUCKET: ${BACKUP_STORAGE_S3_BUCKET:-compass-backups-staging}
      BACKUP_STORAGE_S3_USE_SSL: "True"
      BACKUP_STORAGE_S3_REGION_NAME: ${BACKUP_STORAGE_S3_REGION_NAME:-ap-singapore-1}
      BACKUP_STORAGE_S3_ADDRESSING_STYLE: path
      BACKUP_RESTORE_EXECUTION_MODE: dry_run_only
      # The web process does not execute backup jobs. The dedicated
      # backup-worker service below owns that process.
      BACKUP_WORKER_ENABLED: "False"
    volumes:
      - compass_static:/app/staticfiles
      - ${COMPASS_DATA_ROOT:-/srv/compass/data}/media:/app/media:Z
      - ./deploy/compass-secret-env.sh:/usr/local/bin/compass-secret-env:ro
    secrets:
      - compass-staging-secret-key
      - compass-staging-audit-hash-secret
      - compass-staging-account-security-hash-secret
      - compass-staging-account-activation-token-secret
      - compass-staging-database-url
      - compass-staging-protected-storage-s3-access-key
      - compass-staging-protected-storage-s3-secret-key
      - compass-staging-backup-storage-s3-access-key
      - compass-staging-backup-storage-s3-secret-key
      - compass-staging-field-encryption-key
      - compass-staging-account-security-turnstile-secret
      - compass-staging-email-host-password
      - compass-staging-ecounseling-daily-api-key
      - compass-staging-ecounseling-daily-webhook-secret
      - compass-staging-ecounseling-room-salt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; request=urllib.request.Request(\"http://127.0.0.1:8000/health/\", headers={\"X-Forwarded-Proto\":\"https\"}); urllib.request.urlopen(request, timeout=3)' "]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 45s
    restart: unless-stopped

  backup-worker:
    image: ${COMPASS_IMAGE_REF:?COMPASS_IMAGE_REF is required; provide an image built for the target host architecture}
    entrypoint: ["/usr/local/bin/compass-secret-env"]
    command:
      - python
      - manage.py
      - process_backup_jobs
      - --loop
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      COMPASS_ACCESS_MODE: ${COMPASS_ACCESS_MODE:-health_only}
      COMPASS_SECRET_PREFIX: ${COMPASS_SECRET_PREFIX:-compass-staging}
      DEBUG: "False"
      MAINTENANCE_ENFORCEMENT_ENABLED: ${MAINTENANCE_ENFORCEMENT_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_ENABLED: ${DOCUMENT_PDF_RENDERER_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_TIMEOUT_MS: ${DOCUMENT_PDF_RENDERER_TIMEOUT_MS:-30000}
      ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS: ${ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS:-5}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-True}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-5}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-20}
      NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS: ${NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS:-300}
      BACKUP_WORKER_POLL_INTERVAL_SECONDS: ${BACKUP_WORKER_POLL_INTERVAL_SECONDS:-15}
      REPORT_SYNC_MAX_OUTPUT_BYTES: ${REPORT_SYNC_MAX_OUTPUT_BYTES:-262144}
      REPORT_SYNC_MAX_WORK_UNITS: ${REPORT_SYNC_MAX_WORK_UNITS:-1000}
      REPORT_ASYNC_AFTER_WORK_UNITS: ${REPORT_ASYNC_AFTER_WORK_UNITS:-3000}
      REPORT_RUN_TIMEOUT_SECONDS: ${REPORT_RUN_TIMEOUT_SECONDS:-60}
      REPORT_EXPORT_MAX_OUTPUT_BYTES: ${REPORT_EXPORT_MAX_OUTPUT_BYTES:-8388608}
      PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES: ${PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-staging-api.compass-gco.com},web,proxy,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://staging.compass-gco.com,https://staging-api.compass-gco.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.compass-gco.com}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-False}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/0}
      ECOUNSELING_PROVIDER: ${ECOUNSELING_PROVIDER:-DAILY}
      ECOUNSELING_PROVIDER_MODE: ${ECOUNSELING_PROVIDER_MODE:-DAILY_CLOUD}
      ECOUNSELING_DAILY_API_KEY: ${ECOUNSELING_DAILY_API_KEY:-}
      ECOUNSELING_DAILY_DOMAIN: ${ECOUNSELING_DAILY_DOMAIN:-}
      ECOUNSELING_DAILY_WEBHOOK_ID: ${ECOUNSELING_DAILY_WEBHOOK_ID:-}
      ECOUNSELING_DAILY_WEBHOOK_URL: ${ECOUNSELING_DAILY_WEBHOOK_URL:-https://staging-api.compass-gco.com/counseling/internal/e-counseling/recording-callback/}
      ECOUNSELING_ROOM_PREFIX: ${ECOUNSELING_ROOM_PREFIX:-compass-ecs}
      ECOUNSELING_ROOM_SALT: ${ECOUNSELING_ROOM_SALT:-}
      ECOUNSELING_REQUIRE_PROVIDER_AUTH_IN_PRODUCTION: ${ECOUNSELING_REQUIRE_PROVIDER_AUTH_IN_PRODUCTION:-True}
      ECOUNSELING_UNSAFE_PROVIDER_MODE_ACKNOWLEDGED: ${ECOUNSELING_UNSAFE_PROVIDER_MODE_ACKNOWLEDGED:-False}
      COMPASS_SECRET_ENV_DIR: /run/secrets
      COMPASS_SECRET_ENV_INCLUDE_ECOUNSELING_SECRET: "True"
      COMPASS_SECRET_ENV_INCLUDE_TURNSTILE_SECRET: "True"
      COMPASS_SECRET_ENV_INCLUDE_EMAIL_SECRET: "True"
      COMPASS_RELEASE_VERSION: ${COMPASS_RELEASE_VERSION:?COMPASS_RELEASE_VERSION is required}
      COMPASS_BUILD_ID: ${COMPASS_BUILD_ID:?COMPASS_BUILD_ID is required}
      COMPASS_API_BASE_URL: ${COMPASS_API_BASE_URL:-https://staging-api.compass-gco.com}
      COMPASS_CLIENT_BASE_URL: ${COMPASS_CLIENT_BASE_URL:-https://staging.compass-gco.com}
      ACCOUNT_SECURITY_CAPTCHA_ADAPTER: ${ACCOUNT_SECURITY_CAPTCHA_ADAPTER:-apps.account_security.captcha.CloudflareTurnstileAdapter}
      ACCOUNT_SECURITY_CAPTCHA_PROVIDER: ${ACCOUNT_SECURITY_CAPTCHA_PROVIDER:-turnstile}
      ACCOUNT_SECURITY_TURNSTILE_SITE_KEY: ${ACCOUNT_SECURITY_TURNSTILE_SITE_KEY:?ACCOUNT_SECURITY_TURNSTILE_SITE_KEY is required for OCI staging}
      ACCOUNT_SECURITY_TURNSTILE_SECRET: ${ACCOUNT_SECURITY_TURNSTILE_SECRET:-}
      ACCOUNT_SECURITY_TURNSTILE_HOSTNAMES: ${ACCOUNT_SECURITY_TURNSTILE_HOSTNAMES:-staging.compass-gco.com}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.email.ap-singapore-1.oci.oraclecloud.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@mail.compass-gco.com}
      COMPASS_EMAIL_REPLY_TO: ${COMPASS_EMAIL_REPLY_TO:-noreply@mail.compass-gco.com}
      COMPASS_EMAIL_VERIFIED_SENDER_DOMAIN: ${COMPASS_EMAIL_VERIFIED_SENDER_DOMAIN:-mail.compass-gco.com}
      KEY_SOURCE_PROVIDER: ${KEY_SOURCE_PROVIDER:?KEY_SOURCE_PROVIDER is required}
      KEY_SOURCE_PODMAN_SECRETS_DIR: /run/secrets
      PROTECTED_STORAGE_BACKEND: ${PROTECTED_STORAGE_BACKEND:?PROTECTED_STORAGE_BACKEND is required}
      PROTECTED_STORAGE_S3_ENDPOINT_URL: ${PROTECTED_STORAGE_S3_ENDPOINT_URL:?PROTECTED_STORAGE_S3_ENDPOINT_URL is required}
      PROTECTED_STORAGE_S3_BUCKET_NAME: ${PROTECTED_STORAGE_S3_BUCKET_NAME:-compass-private-staging}
      PROTECTED_STORAGE_S3_USE_SSL: "True"
      PROTECTED_STORAGE_S3_REGION_NAME: ${PROTECTED_STORAGE_S3_REGION_NAME:-ap-singapore-1}
      PROTECTED_STORAGE_S3_ADDRESSING_STYLE: path
      BACKUP_STORAGE_BACKEND: ${BACKUP_STORAGE_BACKEND:?BACKUP_STORAGE_BACKEND is required}
      BACKUP_STORAGE_S3_ENDPOINT_URL: ${BACKUP_STORAGE_S3_ENDPOINT_URL:?BACKUP_STORAGE_S3_ENDPOINT_URL is required}
      BACKUP_STORAGE_S3_BUCKET: ${BACKUP_STORAGE_S3_BUCKET:-compass-backups-staging}
      BACKUP_STORAGE_S3_USE_SSL: "True"
      BACKUP_STORAGE_S3_REGION_NAME: ${BACKUP_STORAGE_S3_REGION_NAME:-ap-singapore-1}
      BACKUP_STORAGE_S3_ADDRESSING_STYLE: path
      BACKUP_LOCAL_DEMO_ROOT: /var/lib/compass-backup-work
      BACKUP_RESTORE_EXECUTION_MODE: dry_run_only
      # Backup processing is enabled only in this dedicated worker service.
      BACKUP_WORKER_ENABLED: "True"
    volumes:
      - ${COMPASS_DATA_ROOT:-/srv/compass/data}/backup-work:/var/lib/compass-backup-work:Z
      - ./deploy/compass-secret-env.sh:/usr/local/bin/compass-secret-env:ro
    secrets:
      - compass-staging-secret-key
      - compass-staging-audit-hash-secret
      - compass-staging-account-security-hash-secret
      - compass-staging-account-activation-token-secret
      - compass-staging-database-url
      - compass-staging-protected-storage-s3-access-key
      - compass-staging-protected-storage-s3-secret-key
      - compass-staging-backup-storage-s3-access-key
      - compass-staging-backup-storage-s3-secret-key
      - compass-staging-field-encryption-key
      - compass-staging-account-security-turnstile-secret
      - compass-staging-email-host-password
      - compass-staging-ecounseling-daily-api-key
      - compass-staging-ecounseling-daily-webhook-secret
      - compass-staging-ecounseling-room-salt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case "$(tr '\000' ' ' </proc/1/cmdline)" in
          *process_backup_jobs*--loop*) exit 0 ;;
          *) exit 1 ;;
          esac
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  notification-worker:
    image: ${COMPASS_IMAGE_REF:?COMPASS_IMAGE_REF is required; provide an image built for the target host architecture}
    entrypoint: ["/usr/local/bin/compass-secret-env"]
    command:
      - /bin/sh
      - -ec
      - >-
        exec python manage.py process_notification_queue --loop
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      COMPASS_ACCESS_MODE: active
      COMPASS_SECRET_PREFIX: ${COMPASS_SECRET_PREFIX:-compass-staging}
      DEBUG: "False"
      MAINTENANCE_ENFORCEMENT_ENABLED: ${MAINTENANCE_ENFORCEMENT_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_ENABLED: ${DOCUMENT_PDF_RENDERER_ENABLED:-False}
      DOCUMENT_PDF_RENDERER_TIMEOUT_MS: ${DOCUMENT_PDF_RENDERER_TIMEOUT_MS:-30000}
      ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS: ${ACCOUNT_SECURITY_CAPTCHA_TIMEOUT_SECONDS:-5}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-True}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-5}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-20}
      NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS: ${NOTIFICATION_WORKER_LOCK_TIMEOUT_SECONDS:-300}
      BACKUP_WORKER_POLL_INTERVAL_SECONDS: ${BACKUP_WORKER_POLL_INTERVAL_SECONDS:-15}
      REPORT_SYNC_MAX_OUTPUT_BYTES: ${REPORT_SYNC_MAX_OUTPUT_BYTES:-262144}
      REPORT_SYNC_MAX_WORK_UNITS: ${REPORT_SYNC_MAX_WORK_UNITS:-1000}
      REPORT_ASYNC_AFTER_WORK_UNITS: ${REPORT_ASYNC_AFTER_WORK_UNITS:-3000}
      REPORT_RUN_TIMEOUT_SECONDS: ${REPORT_RUN_TIMEOUT_SECONDS:-60}
      REPORT_EXPORT_MAX_OUTPUT_BYTES: ${REPORT_EXPORT_MAX_OUTPUT_BYTES:-8388608}
      PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES: ${PROTECTED_STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-staging-api.compass-gco.com},web,proxy,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://staging.compass-gco.com,https://staging-api.compass-gco.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.compass-gco.com}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-False}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/0}
      ECOUNSELING_PROVIDER: ${ECOUNSELING_PROVIDER:-DAILY}
      ECOUNSELING_PROVIDER_MODE: ${ECOUNSELING_PROVIDER_MODE:-DAILY_CLOUD}
      ECOUNSELING_DAILY_API_KEY: ${ECOUNSELING_DAILY_API_KEY:-}
      ECOUNSELING_DAILY_DOMAIN: ${ECOUNSELING_DAILY_DOMAIN:-}
      ECOUNSELING_DAILY_WEBHOOK_ID: ${ECOUNSELING_DAILY_WEBHOOK_ID:-}
      ECOUNSELING_DAILY_WEBHOOK_URL: ${ECOUNSELING_DAILY_WEBHOOK_URL:-https://staging-api.compass-gco.com/counseling/internal/e-counseling/recording-callback/}
      ECOUNSELING_ROOM_PREFIX: ${ECOUNSELING_ROOM_PREFIX:-compass-ecs}
      ECOUNSELING_ROOM_SALT: ${ECOUNSELING_ROOM_SALT:-}
      ECOUNSELING_REQUIRE_PROVIDER_AUTH_IN_PRODUCTION: ${ECOUNSELING_REQUIRE_PROVIDER_AUTH_IN_PRODUCTION:-True}
      ECOUNSELING_UNSAFE_PROVIDER_MODE_ACKNOWLEDGED: ${ECOUNSELING_UNSAFE_PROVIDER_MODE_ACKNOWLEDGED:-False}
      COMPASS_SECRET_ENV_DIR: /run/secrets
      COMPASS_SECRET_ENV_INCLUDE_ECOUNSELING_SECRET: "True"
      COMPASS_SECRET_ENV_INCLUDE_TURNSTILE_SECRET: "True"
      COMPASS_SECRET_ENV_INCLUDE_EMAIL_SECRET: "True"
      COMPASS_RELEASE_VERSION: ${COMPASS_RELEASE_VERSION:?COMPASS_RELEASE_VERSION is required}
      COMPASS_BUILD_ID: ${COMPASS_BUILD_ID:?COMPASS_BUILD_ID is required}
      COMPASS_API_BASE_URL: ${COMPASS_API_BASE_URL:-https://staging-api.compass-gco.com}
      COMPASS_CLIENT_BASE_URL: ${COMPASS_CLIENT_BASE_URL:-https://staging.compass-gco.com}
      ACCOUNT_SECURITY_CAPTCHA_ADAPTER: ${ACCOUNT_SECURITY_CAPTCHA_ADAPTER:-apps.account_security.captcha.CloudflareTurnstileAdapter}
      ACCOUNT_SECURITY_CAPTCHA_PROVIDER: ${ACCOUNT_SECURITY_CAPTCHA_PROVIDER:-turnstile}
      ACCOUNT_SECURITY_TURNSTILE_SITE_KEY: ${ACCOUNT_SECURITY_TURNSTILE_SITE_KEY:?ACCOUNT_SECURITY_TURNSTILE_SITE_KEY is required for OCI staging}
      ACCOUNT_SECURITY_TURNSTILE_SECRET: ${ACCOUNT_SECURITY_TURNSTILE_SECRET:-}
      ACCOUNT_SECURITY_TURNSTILE_HOSTNAMES: ${ACCOUNT_SECURITY_TURNSTILE_HOSTNAMES:-staging.compass-gco.com}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.email.ap-singapore-1.oci.oraclecloud.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@mail.compass-gco.com}
      COMPASS_EMAIL_REPLY_TO: ${COMPASS_EMAIL_REPLY_TO:-noreply@mail.compass-gco.com}
      COMPASS_EMAIL_VERIFIED_SENDER_DOMAIN: ${COMPASS_EMAIL_VERIFIED_SENDER_DOMAIN:-mail.compass-gco.com}
      KEY_SOURCE_PROVIDER: ${KEY_SOURCE_PROVIDER:?KEY_SOURCE_PROVIDER is required}
      KEY_SOURCE_PODMAN_SECRETS_DIR: /run/secrets
      PROTECTED_STORAGE_BACKEND: ${PROTECTED_STORAGE_BACKEND:?PROTECTED_STORAGE_BACKEND is required}
      PROTECTED_STORAGE_S3_ENDPOINT_URL: ${PROTECTED_STORAGE_S3_ENDPOINT_URL:?PROTECTED_STORAGE_S3_ENDPOINT_URL is required}
      PROTECTED_STORAGE_S3_BUCKET_NAME: ${PROTECTED_STORAGE_S3_BUCKET_NAME:-compass-private-staging}
      PROTECTED_STORAGE_S3_USE_SSL: "True"
      PROTECTED_STORAGE_S3_REGION_NAME: ${PROTECTED_STORAGE_S3_REGION_NAME:-ap-singapore-1}
      PROTECTED_STORAGE_S3_ADDRESSING_STYLE: path
      BACKUP_STORAGE_BACKEND: ${BACKUP_STORAGE_BACKEND:?BACKUP_STORAGE_BACKEND is required}
      BACKUP_STORAGE_S3_ENDPOINT_URL: ${BACKUP_STORAGE_S3_ENDPOINT_URL:?BACKUP_STORAGE_S3_ENDPOINT_URL is required}
      BACKUP_STORAGE_S3_BUCKET: ${BACKUP_STORAGE_S3_BUCKET:-compass-backups-staging}
      BACKUP_STORAGE_S3_USE_SSL: "True"
      BACKUP_STORAGE_S3_REGION_NAME: ${BACKUP_STORAGE_S3_REGION_NAME:-ap-singapore-1}
      BACKUP_STORAGE_S3_ADDRESSING_STYLE: path
    secrets:
      - compass-staging-secret-key
      - compass-staging-audit-hash-secret
      - compass-staging-account-security-hash-secret
      - compass-staging-account-activation-token-secret
      - compass-staging-database-url
      - compass-staging-protected-storage-s3-access-key
      - compass-staging-protected-storage-s3-secret-key
      - compass-staging-backup-storage-s3-access-key
      - compass-staging-backup-storage-s3-secret-key
      - compass-staging-field-encryption-key
      - compass-staging-account-security-turnstile-secret
      - compass-staging-email-host-password
      - compass-staging-ecounseling-daily-api-key
      - compass-staging-ecounseling-daily-webhook-secret
      - compass-staging-ecounseling-room-salt
    volumes:
      - ./deploy/compass-secret-env.sh:/usr/local/bin/compass-secret-env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: docker.io/library/nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${COMPASS_STAGING_PORT:-8080}:8080"
    volumes:
      - ./deploy/oci/nginx/compass.conf:/etc/nginx/conf.d/default.conf:ro
      - compass_static:/static:ro
    restart: unless-stopped

secrets:
  # podman-compose 1.2.0 mounts external secrets under their declared names;
  # keep these names aligned with the root-owned Podman secret store.
  compass-staging-postgres-password:
    external: true
  compass-staging-secret-key:
    external: true
  compass-staging-audit-hash-secret:
    external: true
  compass-staging-account-security-hash-secret:
    external: true
  compass-staging-account-activation-token-secret:
    external: true
  compass-staging-database-url:
    external: true
  compass-staging-protected-storage-s3-access-key:
    external: true
  compass-staging-protected-storage-s3-secret-key:
    external: true
  compass-staging-backup-storage-s3-access-key:
    external: true
  compass-staging-backup-storage-s3-secret-key:
    external: true
  compass-staging-field-encryption-key:
    external: true
  compass-staging-account-security-turnstile-secret:
    external: true
  compass-staging-email-host-password:
    external: true
  compass-staging-ecounseling-daily-api-key:
    external: true
  compass-staging-ecounseling-daily-webhook-secret:
    external: true
  compass-staging-ecounseling-room-salt:
    external: true

volumes:
  compass_static:
