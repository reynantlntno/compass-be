# TLS terminates at the OCI Load Balancer. This Nginx proxy is internal-only on
# port 8080; the app subnet NSG permits that port only from the LB NSG.
# Protected/media files remain behind COMPASS protected-storage authorization.

server {
    listen 8080;
    server_name _;
    client_max_body_size 12m;
    # The service is intentionally not indexable. This also covers Nginx
    # generated error responses; proxied application responses set the same
    # header at the API application boundary.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # The repository proxy omits query strings from access logging. The
    # institution edge must provide equivalent redaction in staging.
    access_log off;

    # The LB backend health check must satisfy the API service's HTTPS-only
    # settings. Keep this liveness path content-free and domain-independent.
    location = /health/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Recovery bearer tokens are query parameters.  Keep their URLs out of
    # repository-controlled access logs while preserving status observability.
    location /accounts/security/recovery/reset/ {
        access_log off;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Student activation bearer values are also query parameters.  Never emit
    # their request targets into repository-controlled access logs.
    location /accounts/activate/ {
        access_log off;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
